<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3c864a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a6b4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" stroke="#1b5e20" stroke-width="2"/>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#grad2)" stroke-width="4"/>
  
  <!-- Network nodes (triad) -->
  <g stroke-width="3">
    <!-- Top node -->
    <circle cx="100" cy="40" r="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="100" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20" font-family="sans-serif">C</text>
    
    <!-- Bottom Left node -->
    <circle cx="50" cy="130" r="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="50" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20" font-family="sans-serif">P</text>
    
    <!-- Bottom Right node -->
    <circle cx="150" cy="130" r="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="150" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20" font-family="sans-serif">A</text>
  </g>
  
  <!-- Connecting edges -->
  <line x1="100" y1="54" x2="50" y2="116" stroke="#2e7d32" stroke-width="3"/>
  <line x1="100" y1="54" x2="150" y2="116" stroke="#2e7d32" stroke-width="3"/>
  <line x1="64" y1="130" x2="136" y2="130" stroke="#2e7d32" stroke-width="3"/>
  
  <!-- Small semantic dot decorations -->
  <circle cx="75" cy="75" r="4" fill="#a5d6a7" opacity="0.6"/>
  <circle cx="130" cy="75" r="4" fill="#a5d6a7" opacity="0.6"/>
  <circle cx="75" cy="120" r="4" fill="#a5d6a7" opacity="0.6"/>
  <circle cx="130" cy="120" r="4" fill="#a5d6a7" opacity="0.6"/>
</svg>